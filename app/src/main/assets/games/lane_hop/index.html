<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lane Hop</title>
<style>
  html, body { margin: 0; height: 100%; background: #070816; overflow: hidden; touch-action: none; font-family: sans-serif; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  'use strict';
  // Goal: let 40 blocks pass. Tap the left or right half (or use the arrow keys) to hop between three lanes.
  // Any block that reaches you in your lane ends the run.
  const GOAL = 40;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, best = 0;
  let lane, px, obstacles, score, state, spawnT, speed, time, overT;
  try { best = +(localStorage.getItem('laneHopBest') || 0); } catch (e) { }

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);

  const laneX = i => W * (i + 1) / 4;
  const playerY = () => H - 140;
  const blockW = () => W * 0.2;

  function reset() {
    lane = 1; px = laneX(1); obstacles = []; score = 0; state = 'play';
    spawnT = 0.6; speed = 240; time = 0; overT = 0;
  }
  function move(d) { lane = Math.max(0, Math.min(2, lane + d)); }

  function endRun(next) {
    state = next; overT = 0;
    if (score > best) { best = score; try { localStorage.setItem('laneHopBest', best); } catch (e) { } }
  }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state !== 'play') { if (overT > 0.6) reset(); return; }
    move(e.clientX < W / 2 ? -1 : 1);
  });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') move(-1);
    else if (e.key === 'ArrowRight') move(1);
    else if (state !== 'play' && overT > 0.6 && (e.key === ' ' || e.key === 'Enter')) reset();
  });

  function update(dt) {
    time += dt;
    if (state !== 'play') { overT += dt; return; }
    px += (laneX(lane) - px) * Math.min(1, dt * 18);
    spawnT -= dt;
    if (spawnT <= 0) {
      // One block per spawn, so at least two lanes are always open.
      obstacles.push({ lane: Math.floor(Math.random() * 3), y: -40, done: false });
      spawnT = Math.max(0.5, 0.9 - score * 0.01);
    }
    speed = Math.min(540, 240 + score * 7);
    const py = playerY();
    for (const o of obstacles) {
      o.y += speed * dt;
      if (!o.done && o.lane === lane && Math.abs(o.y - py) < 40) { endRun('over'); return; }
      if (!o.done && o.y > py + 40) { o.done = true; score++; }
    }
    obstacles = obstacles.filter(o => o.y < H + 40);
    if (score >= GOAL) endRun('won');
  }

  function draw() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#070816'); bg.addColorStop(1, '#1d1040');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(W * 0.125, 0, W * 0.75, H);
    ctx.fillStyle = 'rgba(0,194,255,0.35)';
    const off = (time * speed) % 60;
    for (const x of [W * 0.375, W * 0.625]) {
      for (let y = off - 60; y < H; y += 60) ctx.fillRect(x - 2, y, 4, 30);
    }

    ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 16; ctx.fillStyle = '#ff2bd6';
    for (const o of obstacles) ctx.fillRect(laneX(o.lane) - blockW() / 2, o.y - 20, blockW(), 40);

    const py = playerY();
    ctx.shadowColor = '#00c2ff'; ctx.shadowBlur = 20; ctx.fillStyle = '#00c2ff';
    ctx.beginPath(); ctx.moveTo(px, py - 22); ctx.lineTo(px + 22, py + 18); ctx.lineTo(px - 22, py + 18);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;

    // Side cues drawn as arrows, no text
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.moveTo(W / 2 - 70, H - 40); ctx.lineTo(W / 2 - 100, H - 52); ctx.lineTo(W / 2 - 100, H - 28); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W / 2 + 70, H - 40); ctx.lineTo(W / 2 + 100, H - 52); ctx.lineTo(W / 2 + 100, H - 28); ctx.fill();

    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText(score + ' / ' + GOAL, 20, 40);
    ctx.textAlign = 'right'; ctx.font = '16px sans-serif'; ctx.fillStyle = '#aaa';
    ctx.fillText('BEST ' + best, W - 20, 40);

    if (state !== 'play') {
      ctx.fillStyle = 'rgba(5,4,14,0.7)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.font = 'bold 40px sans-serif';
      ctx.fillText(state === 'won' ? 'CLEARED!' : 'GAME OVER', W / 2, H * 0.38);
      ctx.font = '22px sans-serif';
      ctx.fillText('Score ' + score, W / 2, H * 0.38 + 44);
      const bw = 180, bh = 52, bx = W / 2 - bw / 2, by = H * 0.5;
      ctx.fillStyle = '#00c2ff'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#070816'; ctx.font = 'bold 20px sans-serif';
      ctx.fillText('Play again', W / 2, by + 33);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
