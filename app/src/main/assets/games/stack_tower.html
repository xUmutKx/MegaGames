<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Stack Tower</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0b1a; overflow: hidden; touch-action: none; font-family: sans-serif; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const COLORS = ['#27f5a0', '#00c2ff', '#ff2bd6', '#ffb347', '#b6ff3d', '#7b6bff'];
  let blocks, cur, dir, speed, score, state, best = +(localStorage.getItem('stackBest') || 0), particles;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);

  function reset() {
    const w = Math.min(W, H) * 0.42;
    blocks = [{ x: W / 2 - w / 2, w, y: 0, c: COLORS[0] }];
    cur = { x: 0, w, c: COLORS[1] };
    dir = 1; speed = Math.max(160, Math.min(W, H) * 0.55); score = 0; state = 'play'; particles = [];
    spawn();
  }

  function spawn() {
    const i = blocks.length;
    cur.c = COLORS[i % COLORS.length];
    cur.y = 0;
    cur.x = dir > 0 ? -cur.w : W;
  }

  const blockH = () => Math.max(26, Math.min(W, H) * 0.06);

  function drop() {
    if (state !== 'play') return;
    const top = blocks[blocks.length - 1];
    const left = Math.max(cur.x, top.x);
    const right = Math.min(cur.x + cur.w, top.x + top.w);
    const overlap = right - left;
    if (overlap <= 0) { end(); return; }
    const perfect = Math.abs(cur.x - top.x) < 6;
    const placed = { x: perfect ? top.x : left, w: perfect ? top.w : overlap, c: cur.c, y: blocks.length };
    // slices that hang over the edge fall away
    if (!perfect) {
      const slices = [];
      if (cur.x < top.x) slices.push({ x: cur.x, w: top.x - cur.x });
      else if (cur.x + cur.w > top.x + top.w) slices.push({ x: top.x + top.w, w: cur.x + cur.w - (top.x + top.w) });
      slices.forEach(s => particles.push({ x: s.x, w: s.w, y: blocks.length, vy: 0, c: cur.c, life: 1 }));
    }
    blocks.push(placed);
    score++;
    if (perfect) burst(placed);
    cur.w = placed.w;
    speed = Math.min(speed * 1.03, Math.max(W, H) * 1.2);
    dir = -dir;
    spawn();
  }

  function burst(b) {
    for (let i = 0; i < 14; i++) particles.push({ x: b.x + Math.random() * b.w, w: 4, y: b.y, vy: -90 - Math.random() * 120, vx: (Math.random() - 0.5) * 120, c: '#ffffff', life: 1, dot: true });
  }

  function end() {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('stackBest', best); } catch (e) {} }
    cur.falling = true; cur.vy = 0;
  }

  // touch / mouse / keyboard
  cv.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'over') reset(); else drop(); });
  addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { if (state === 'over') reset(); else drop(); } });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (state === 'play') {
      cur.x += dir * speed * dt;
      if (cur.x + cur.w > W + 10 && dir > 0) dir = -1;
      if (cur.x < -10 && dir < 0) dir = 1;
    }
    if (cur.falling) { cur.vy += 1400 * dt; cur.y += cur.vy * dt; }
    particles.forEach(p => { if (p.dot) { p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt * 0.1; p.life -= dt * 1.4; } else { p.vy += 1400 * dt; p.y += p.vy * dt * 0.2; p.life -= dt; } });
    particles = particles.filter(p => p.life > 0);
    draw();
    requestAnimationFrame(frame);
  }

  function draw() {
    const bh = blockH();
    const base = H * 0.86;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#120c2a'); g.addColorStop(1, '#0d0b1a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const camShift = Math.max(0, (blocks.length - 8) * bh);
    const yOf = (i) => base - i * bh + camShift;
    blocks.forEach((b, i) => rect(b.x, yOf(i) - bh, b.w, bh - 3, b.c));
    if (state === 'play') rect(cur.x, yOf(blocks.length) - bh, cur.w, bh - 3, cur.c);
    else if (cur.falling) rect(cur.x, yOf(blocks.length) - bh + cur.y, cur.w, bh - 3, cur.c);
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.dot) { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, yOf(p.y) - bh / 2, 3, 0, 7); ctx.fill(); }
      else rect(p.x, yOf(p.y) - bh + 0, p.w, bh - 3, p.c);
      ctx.globalAlpha = 1;
    });
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = `bold ${Math.round(H * 0.07)}px sans-serif`;
    ctx.fillText(score, W / 2, H * 0.12);
    ctx.font = `${Math.round(H * 0.022)}px sans-serif`;
    ctx.fillStyle = '#9d95c9';
    ctx.fillText('best ' + best, W / 2, H * 0.12 + H * 0.04);
    if (state === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(H * 0.05)}px sans-serif`;
      ctx.fillText('Tap to play again', W / 2, H / 2);
    }
  }

  function rect(x, y, w, h, c) {
    ctx.fillStyle = c;
    const r = Math.min(8, h / 3);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
  }

  resize(); reset();
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
