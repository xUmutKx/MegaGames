<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Orbit Dodge</title>
<style>
  html, body { margin: 0; height: 100%; background: #07061a; overflow: hidden; touch-action: none; font-family: sans-serif; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, cx = 0, cy = 0, R = 0;
  let angle, dir, speed, rocks, score, time, state, best = +(localStorage.getItem('orbitBest') || 0), stars;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2;
    R = Math.min(W, H) * 0.3;
    stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.3, s: Math.random() * 0.4 + 0.1 }));
  }
  addEventListener('resize', resize);

  // The player rides a ring around the planet. Tap the left half to reverse; hold to move faster.
  let holding = 0;
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state !== 'play') { reset(); return; }
    dir = -dir;
    holding = 1;
  });
  cv.addEventListener('pointerup', () => { holding = 0; });
  cv.addEventListener('pointercancel', () => { holding = 0; });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { if (state !== 'play') reset(); else dir = -dir; }
  });

  function reset() {
    angle = 0; dir = 1; speed = 1.6; rocks = []; score = 0; time = 0; state = 'play';
  }

  function spawnRock() {
    // a rock comes in from outside the ring along a random radius
    const a = Math.random() * Math.PI * 2;
    rocks.push({ a, r: Math.max(W, H) * 0.7, v: 180 + Math.random() * 120 + time * 4, size: 8 + Math.random() * 8 });
  }

  let last = performance.now(), spawnT = 0;
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (state === 'play') {
      time += dt;
      angle += dir * speed * (holding ? 1.6 : 1) * dt;
      spawnT -= dt;
      if (spawnT <= 0) { spawnRock(); spawnT = Math.max(0.35, 1.1 - time * 0.02); }
      for (const k of rocks) k.r -= k.v * dt;
      // a rock reaching the ring hits it when the player is at the same angle
      for (const k of rocks) {
        if (k.hit || k.r > R + 10 || k.r < R - 12) continue;
        k.hit = true;
        const diff = Math.abs(Math.atan2(Math.sin(k.a - angle), Math.cos(k.a - angle)));
        if (diff < 0.22) { end(); break; }
        score++;
      }
      rocks = rocks.filter(k => k.r > -40);
      speed = 1.6 + Math.min(1.8, time * 0.02);
    }
    draw();
    requestAnimationFrame(frame);
  }

  function end() {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('orbitBest', best); } catch (e) {} }
  }

  function draw() {
    ctx.fillStyle = '#07061a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    for (const s of stars) { ctx.globalAlpha = 0.35 + s.s; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;

    // planet
    const g = ctx.createRadialGradient(cx - R * 0.25, cy - R * 0.25, R * 0.1, cx, cy, R * 0.8);
    g.addColorStop(0, '#5ff7c6'); g.addColorStop(1, '#1b6b5a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 0.8, 0, 7); ctx.fill();

    // ring
    ctx.strokeStyle = 'rgba(0,194,255,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();

    // rocks
    ctx.fillStyle = '#ff2bd6';
    for (const k of rocks) {
      if (k.r < 0) continue;
      const x = cx + Math.cos(k.a) * k.r, y = cy + Math.sin(k.a) * k.r;
      ctx.beginPath(); ctx.arc(x, y, k.size * (k.r > R ? 1 : 0.8), 0, 7); ctx.fill();
    }

    // player
    const px = cx + Math.cos(angle) * R, py = cy + Math.sin(angle) * R;
    ctx.fillStyle = '#ffb347'; ctx.shadowColor = '#ffb347'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(px, py, Math.max(10, R * 0.07), 0, 7); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.round(H * 0.05)}px sans-serif`;
    ctx.fillText(score, W / 2, H * 0.1);
    ctx.font = `${Math.round(H * 0.022)}px sans-serif`;
    ctx.fillStyle = '#9d95c9';
    ctx.fillText('best ' + best + '   ·   tap to reverse, hold to speed up', W / 2, H * 0.1 + H * 0.04);

    if (state === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(H * 0.05)}px sans-serif`;
      ctx.fillText('Tap to try again', W / 2, H / 2);
    }
  }

  resize(); reset();
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
